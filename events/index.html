<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events — Cumnor Hurst</title>
  <link rel="stylesheet" href="/site.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="subpage-page">
<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="/index.html">
      <span class="brand-mark">CH</span>
      <span><strong>Cumnor Hurst</strong><small>Nature, history &amp; community</small></span>
    </a>
  </div>
</header>

<main>
  <section class="section">
    <div class="subpage-content">
      <p class="eyebrow dark">Cumnor Hurst</p>
      <h1>Events</h1>
      <p style="font-size: 1.2rem; max-width: 600px;">
        What's happening at Cumnor Hurst.
      </p> 
      <div id="events-feed" aria-live="polite"> 
        <p>Loading events…</p> 
      </div>
      <p><a class="text-link" href="/">← Back to Cumnor Hurst</a></p>
    </div>
  </section>
</main>

<footer>
  <div class="container footer-bottom">
    <span>© Cumnor Hurst</span>
    <span>Site of Special Scientific Interest</span>
  </div>
</footer>

<script>
const EVENTS_URL = "https://script.google.com/macros/s/AKfycbwlyRDThN-YTvIsuaMxBAxBW5epn72L5KCxQW8rVgxnJYSv5RahWv15Fv-OTVi2NTDo2A/exec";

async function loadEvents() {
  const feed = document.getElementById("events-feed");

  try {
    const response = await fetch(EVENTS_URL);

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const data = await response.json();

    if (data.error) {
      throw new Error(data.error);
    }

    feed.replaceChildren();

    if (!data.events || data.events.length === 0) {
      feed.textContent = "There are no upcoming events at present.";
      return;
    }

    data.events.forEach(event => {
      const card = document.createElement("article");
      card.className = "event-card";

      const title = document.createElement("h2");
      title.textContent = event.title || "Untitled event";
      card.appendChild(title);

      const date = document.createElement("p");
      date.className = "event-date";

      const start = new Date(event.start);
      const end = new Date(event.end);

      if (event.allDay) {
        date.textContent = start.toLocaleDateString("en-GB", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        });
      } else {
        date.textContent =
          start.toLocaleDateString("en-GB", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
          }) + " · " +
          start.toLocaleTimeString("en-GB", {
            hour: "2-digit",
            minute: "2-digit"
          }) + "–" +
          end.toLocaleTimeString("en-GB", {
            hour: "2-digit",
            minute: "2-digit"
          });
      }

      card.appendChild(date);


      if (event.location) {
        const location = document.createElement("p");
        location.className = "event-location";
        location.textContent = event.location;
        card.appendChild(location);
      }

      if (event.description) {
        const description = document.createElement("p");
        description.className = "event-description";
        description.textContent = event.description;
        card.appendChild(description);
      }
      
      if (event.contributor) {
        const contributor = document.createElement("p");
        contributor.className = "event-contributor";
        contributor.textContent = "Added by " + event.contributor;
        card.appendChild(contributor);
      }
      

      feed.appendChild(card);
    });

  } catch (error) {
    console.error("Could not load events:", error);
    feed.textContent =
      "Sorry, events could not be loaded just now. Please try again later.";
  }
}

loadEvents();
</script>

</body>
</html>
