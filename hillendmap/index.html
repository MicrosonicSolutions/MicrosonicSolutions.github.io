<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Cumnor Hurst Map</title>

    <link rel="stylesheet"
          href="https://www.cumnorhurst.org.uk/hurstmap/style.css?v=1">

</head>


<body>
  
    <div id="map-container">

        <img id="map-image"
             src="HillEnd.jpg"
             alt="Hill End map">

        <div id="poi-container"></div>

        <div id="accuracy-circle"></div>

        <div id="position-marker"></div>

    </div>


	<div id="controls">

		<button id="gps-button">
			Show location
		</button>
    
    <button id="poi-button">
      Show points of interest
    </button>

		<span id="gps-status"></span>

	</div>
  
  <div id="poi-popup">
    <button id="poi-close">×</button>

    <img id="poi-image"
         src=""
         alt="">

    <h2 id="poi-title"></h2>

    <p id="poi-text"></p>
  </div>

  <script src="https://www.cumnorhurst.org.uk/hurstmap/debug.js?v=1"></script>
  <script src="mapProjection.js?v=1"></script>
  <script src="https://www.cumnorhurst.org.uk/hurstmap/pois.js?v=1"></script>
  <script src="https://www.cumnorhurst.org.uk/hurstmap/app.js?v=1"></script>

</body>

</html>
