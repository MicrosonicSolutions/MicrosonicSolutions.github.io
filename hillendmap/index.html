<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Hill End Map</title>

    <link rel="stylesheet" href="/style.css?v=1">
    <link rel="icon" href="/Favicon.jpg" type="image/jpeg">
</head>


<body>
  
    <div id="map-container">

        <img id="map-image"
             src="HillEnd.jpg"
             alt="Hill End map">

        <div id="poi-container"></div>

        <div id="accuracy-circle"></div>

        <div id="position-marker"></div>

    </div>


	<div id="controls">

		<button id="gps-button">
			Show location
		</button>
    
    <button id="poi-button">
      Show options
    </button>

		<span id="gps-status"></span>

	</div>
  
  <div id="options-popup">
    <h2>Map options</h2>

    <label>
      <input type="checkbox" id="poi-checkbox">
      Points of interest
    </label>

    <div class="options-actions">
      <button id="options-cancel">Cancel</button>
      <button id="options-apply">Apply</button>
    </div>
  </div>  
  
  <div id="poi-popup">
    <button id="poi-close">×</button>

    <img id="poi-image"
         src=""
         alt="">

    <h2 id="poi-title"></h2>

    <p id="poi-text"></p>
  </div>

  <script src="https://www.cumnorhurst.org.uk/hurstmap/debug.js?v=1"></script>
  <script src="mapProjection.js?v=1"></script>
  <script src="https://www.cumnorhurst.org.uk/hurstmap/pois.js?v=1"></script>
  <script src="app.js?v=1"></script>

</body>

</html>
