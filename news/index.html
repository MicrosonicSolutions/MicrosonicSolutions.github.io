<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News — Cumnor Hurst</title>
  <link rel="stylesheet" href="/site.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="subpage-page">
<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="/index.html">
      <span class="brand-mark">CH</span>
      <span><strong>Cumnor Hurst</strong><small>Nature, history &amp; community</small></span>
    </a>
  </div>
</header>

<main>
  <section class="section">
    <div class="subpage-content">
      <p class="eyebrow dark">Cumnor Hurst</p>
      <h1>News</h1>
      <div id="news-feed" class="news-feed" aria-live="polite">
        <p>Loading news…</p>
      </div>
      <p><a class="text-link" href="/">← Back to Cumnor Hurst</a></p>
    </div>
  </section>

  <div class="container footer-bottom">

  </div>
</footer>
</body>
</html>


<script>
(async function loadNews() {
  const BLOG_ID = "1963404734899397669";
  const API_KEY = "AIzaSyB1hJWHZX6Kl774e6UNhkRps93P2Dha3tg";

  const feed = document.getElementById("news-feed");

  const endpoint =
    `https://www.googleapis.com/blogger/v3/blogs/${BLOG_ID}/posts` +
    `?key=${API_KEY}&status=live&maxResults=10`;

  try {
    const response = await fetch(endpoint);

    if (!response.ok) {
      const details = await response.text();
      console.error(
        "Blogger API response:",
        response.status,
        details
      );
      throw new Error(`Blogger API returned HTTP ${response.status}`);
    }

    const data = await response.json();
    feed.replaceChildren();

    if (!data.items || data.items.length === 0) {
      feed.textContent = "No news articles have been published yet.";
      return;
    }

    data.items.forEach(post => {
      const article = document.createElement("article");
      article.className = "news-card";

      const title = document.createElement("h2");
      const titleLink = document.createElement("a");
      titleLink.href = post.url;
      titleLink.textContent = post.title;
      titleLink.target = "_blank";
      titleLink.rel = "noopener noreferrer";
      title.appendChild(titleLink);
      article.appendChild(title);

      const meta = document.createElement("p");
      meta.className = "news-meta";

      console.log("Post author data:", post.title, post.author);
      const author = post.author?.displayName || "Cumnor Hurst";
      const date = post.published
        ? new Date(post.published).toLocaleDateString("en-GB", {
            day: "numeric",
            month: "long",
            year: "numeric"
          })
        : "";

      meta.textContent = [author, date].filter(Boolean).join(" · ");
      article.appendChild(meta);

      // Extract a preview and the first image from the article.
      const parser = new DOMParser();
      const doc = parser.parseFromString(
        post.content || "",
        "text/html"
      );

      const firstImage = doc.querySelector("img");

      if (firstImage && firstImage.src) {
        try {
          const imageURL = new URL(firstImage.src);

          if (["https:", "http:"].includes(imageURL.protocol)) {
            const image = document.createElement("img");
            image.src = imageURL.href;
            image.alt = firstImage.alt || post.title;
            image.loading = "lazy";
            image.className = "news-image";
            article.appendChild(image);
          }
        } catch (_) {
          // Ignore invalid image URLs.
        }
      }

      const content = document.createElement("div");
      content.className = "news-content";
      content.innerHTML = post.content || "";

      article.appendChild(content);
/*
      const more = document.createElement("a");
      more.className = "text-link";
      more.href = post.url;
      more.textContent = "Read more →";
      more.target = "_blank";
      more.rel = "noopener noreferrer";
      article.appendChild(more);
*/
      feed.appendChild(article);

    });

  } catch (error) {
    console.error("News feed error:", error);
    feed.textContent =
      "News is temporarily unavailable. Please try again later.";
  }
})();
</script>
