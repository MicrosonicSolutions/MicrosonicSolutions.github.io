<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Cumnor Hurst Map</title>

    <link rel="stylesheet"
          href="style.css?v=13">

</head>


<body>

    <div id="map-container">

        <img id="map-image"
             src="HurstMap.jpeg"
             alt="Cumnor Hurst map">

        <div id="accuracy-circle"></div>

        <div id="position-marker"></div>

    </div>


	<div id="controls">

		<button id="gps-button">
			Show location
		</button>

		<span id="gps-status"></span>

	</div>

    <script src="mapProjection.js?v=15"></script>

    <script src="app.js?v=15"></script>

</body>

</html>
